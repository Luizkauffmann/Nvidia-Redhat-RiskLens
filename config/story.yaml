# The injected July -> August 2026 story. The generator reads this file;
# changing it changes the data and the ground truth reproducibly.

product_mix:            # July loan counts (sum = settings.n_loans)
  Mortgage: 7000
  Auto Loan: 11000
  Personal Loan: 7000
  Credit Card: 18000
  Commercial Term Loan: 2900
  Revolving Credit Facility: 1200
  Equipment Lease: 1600
  Commercial Real Estate: 1300

# Peak deviation from the long-run anchor, per forecast vintage and scenario.
# August is deliberately worse: unemployment up most, CRE values down, rates elevated.
macro_peak_deviation:
  "2026-07-31":
    baseline:       {unemployment_rate: 0.40, gdp_growth: -0.40, interest_rate: 0.50, hpi_growth: -1.0, cre_price_growth: -2.0,  inflation: 0.30}
    adverse:        {unemployment_rate: 2.20, gdp_growth: -2.50, interest_rate: 0.25, hpi_growth: -6.0, cre_price_growth: -12.0, inflation: 0.80}
    severe_adverse: {unemployment_rate: 4.30, gdp_growth: -5.00, interest_rate: -0.50, hpi_growth: -14.0, cre_price_growth: -25.0, inflation: 1.20}
  "2026-08-31":
    baseline:       {unemployment_rate: 1.35, gdp_growth: -1.00, interest_rate: 0.60, hpi_growth: -1.6, cre_price_growth: -4.0,  inflation: 0.35}
    adverse:        {unemployment_rate: 3.30, gdp_growth: -3.10, interest_rate: 0.40, hpi_growth: -7.0, cre_price_growth: -15.0, inflation: 0.90}
    severe_adverse: {unemployment_rate: 5.00, gdp_growth: -5.60, interest_rate: -0.30, hpi_growth: -15.0, cre_price_growth: -28.0, inflation: 1.30}

scenario_weights:
  "2026-07-31": {baseline: 0.60, adverse: 0.30, severe_adverse: 0.10}
  "2026-08-31": {baseline: 0.58, adverse: 0.30, severe_adverse: 0.12}

management_overlays:    # unchanged month over month in this story
  - {overlay_id: OVL_CRE_OFFICE, portfolio: CRE, amount: 1500000, reason: "Office refinancing risk not captured by CRE_PD_v4"}
  - {overlay_id: OVL_CONSUMER_STUDENT, portfolio: Consumer, amount: 400000, reason: "Student-loan repayment restart impact on unsecured consumer"}

# Credit deterioration cohort: CRE office/retail borrowers that weaken.
cre_cohort:
  n_borrowers: 20
  property_types: [Office, Retail]
  exposure_range: [5000000, 12000000]
  largest_exposure: 18000000
  july: {rating_notch: [11, 12], dscr: [1.25, 1.38], ltv: [0.66, 0.72]}
  august_shock:
    rating_downgrade_notches: [1, 3]      # the largest borrower gets 3
    dscr_drop: [0.07, 0.12]
    property_value_decline: [0.04, 0.07]  # LTV = balance / property value
    watchlist_share: 0.3

background:             # month-on-month behaviour of the rest of the book
  monthly_payoff_rate: {Mortgage: 0.007, Auto Loan: 0.012, Personal Loan: 0.015, Credit Card: 0.004, Commercial Term Loan: 0.004, Revolving Credit Facility: 0.002, Equipment Lease: 0.006, Commercial Real Estate: 0.003}
  retail_dpd_mix: [0.977, 0.010, 0.006, 0.004, 0.003]      # July share at DPD 0 / 15 / 45 / 75 / 120
  commercial_dpd_mix: [0.995, 0.0, 0.003, 0.001, 0.001]
  retail_fico_drift_sd: 6.0
  retail_roll_rate: 0.006
  retail_cure_rate: 0.35
  chargeoff_rate: 0.25
  commercial_migration_rate: 0.015   # share downgraded and share upgraded by one notch
  commercial_renewal_rate: 0.85      # matured commercial loans renewed rather than repaid

originations:           # August new business (loan counts)
  Mortgage: 160
  Auto Loan: 700
  Personal Loan: 300
  Credit Card: 900
  Commercial Term Loan: 70
  Revolving Credit Facility: 25
  Equipment Lease: 60
  Commercial Real Estate: 12
new_cre_exposure: 40000000     # total balance of the new CRE loans
