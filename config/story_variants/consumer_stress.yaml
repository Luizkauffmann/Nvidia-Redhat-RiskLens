# Labour-market shock that lands on retail: unemployment and GDP worsen sharply while property
# prices hold, so cards and consumer lending carry the increase instead of CRE.
description: "Consumer stress: unemployment shock, property prices flat"
design: {primary_driver: macroeconomic, primary_macro_variable: unemployment_rate}
macro_peak_deviation:
  "2026-08-31":
    baseline:       {unemployment_rate: 1.80, gdp_growth: -1.40, interest_rate: 0.50, hpi_growth: -1.0, cre_price_growth: -2.0, inflation: 0.30}
    adverse:        {unemployment_rate: 4.20, gdp_growth: -4.00, interest_rate: 0.25, hpi_growth: -6.0, cre_price_growth: -12.0, inflation: 0.80}
    severe_adverse: {unemployment_rate: 6.80, gdp_growth: -7.00, interest_rate: -0.50, hpi_growth: -14.0, cre_price_growth: -25.0, inflation: 1.20}
scenario_weights:
  "2026-08-31": {baseline: 0.60, adverse: 0.30, severe_adverse: 0.10}
cre_cohort:
  n_borrowers: 6
  august_shock: {rating_downgrade_notches: [1, 1], dscr_drop: [0.02, 0.04], property_value_decline: [0.01, 0.02], watchlist_share: 0.2, dpd_30_count: 0}
